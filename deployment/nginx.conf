# Nginx configuration template for GreyIQ production deployment
# Place this in /etc/nginx/sites-available/greyiq and symlink to sites-enabled/

server {
    listen 80;
    server_name greyiqsolutions.com www.greyiqsolutions.com;

    # Redirect all HTTP traffic to HTTPS (recommended)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name greyiqsolutions.com www.greyiqsolutions.com;

    # SSL Certificate Paths (managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/greyiqsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greyiqsolutions.com/privkey.pem;

    # SSL Optimization settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers EECDH+AESGCM:EDH+AESGCM;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Client body size limits (important for bulk file uploads if any)
    client_max_body_size 20M;

    # Root folder containing built static files of the Vite frontend
    root /var/www/greyiq/client/dist;
    index index.html;

    # Frontend routing handler (fallback to index.html for React router history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy configuration to route all '/api' requests to node backend server
    location /api {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        
        # Headers to forward real client information to the Node.js backend
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
}
